<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151b19" media="(prefers-color-scheme: dark)">
  <title>Pantry Match</title>
</head>
<body>
  <ion-app>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4c-8 0-14 4-14 11 0 1.4.3 2.6.8 3.6L5 20.4l1.4 1.4 1.8-1.8c1 .6 2.3 1 3.8 1 6 0 8-6 8-13V4z"/></svg>
          </span>
          <h1>Pantry Match</h1>
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <main class="page">
        <section>
          <div class="section-head"><h2>Add ingredients</h2></div>
          <form class="add-row" id="add-form" autocomplete="off">
            <ion-input class="pm-input" id="ing-input" aria-label="Add an ingredient" placeholder="e.g. eggs, cheese" enterkeyhint="done"></ion-input>
            <ion-button class="add-btn" type="submit">Add</ion-button>
          </form>
          <p class="hint">Separate several with commas.</p>
          <!-- Outside #pantry so a failed save still shows when the pantry is empty. -->
          <p class="save-note" id="saved-note">
            <svg class="icon-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
            <span class="icon-error" aria-hidden="true">!</span>
            <span id="saved-text">Saved on this device</span>
          </p>
        </section>

        <section id="pantry" hidden>
          <div class="section-head">
            <h2>Your pantry</h2>
            <button class="link-btn" id="clear-btn" type="button">Clear all</button>
          </div>
          <div class="chips" id="chips"></div>
        </section>

        <section>
          <div class="section-head"><h2 id="results-title" tabindex="-1">Top recipes</h2></div>
          <div id="results" aria-live="polite"></div>
        </section>

        <section>
          <div class="section-head"><h2>AI ideas</h2></div>
          <ion-button class="ai-btn" id="ai-btn" aria-busy="false">Suggest with AI</ion-button>
          <p class="hint ai-hint">Sends your pantry list to Google Gemini.</p>
          <div id="ai-results" aria-live="polite"></div>
        </section>
      </main>
    </ion-content>
  </ion-app>

  <!-- Copied (never parsed from text) into each empty state. -->
  <template id="basket-icon">
    <span class="empty-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7L4 10z"/><path d="M8 10l4-6 4 6"/><path d="M10 14v3M14 14v3"/></svg>
    </span>
  </template>

  <script type="module">
    // Ionic's CSS, then our theme and page CSS last so they win.
    import "@ionic/core/css/core.css";
    import "@ionic/core/css/normalize.css";
    import "@ionic/core/css/structure.css";
    import "@ionic/core/css/typography.css";
    import "@ionic/core/css/palettes/dark.system.css";
    import "./theme.css";
    import "./app.css";

    import { matchRecipes, sameIngredient } from "./match.js";
    import { recipes } from "./recipes.js";
    import { parseIngredients } from "./parse.js";
    import { savePantry, loadPantry } from "./pantry.js";
    import { checkSuggestions } from "./suggest.js";
    import { backAction } from "./back.js";

    // One look on every device (see DESIGN.md). Ionic is loaded at runtime from
    // the base path, as in Ionic's JS quickstart. Without it the input and
    // buttons don't work, so the page only asks the user to refresh.
    window.Ionic = { config: { mode: "md" } };
    try {
      await import(/* @vite-ignore */ import.meta.env.BASE_URL + "ionic.esm.js");
    } catch (error) {
      console.error("Ionic didn't load", error);
      document.querySelector(".page").prepend(el("p", {
        className: "load-error", role: "alert",
        textContent: "Part of the page didn't load. Refresh to try again.",
      }));
    }

    // The AI proxy (worker/): the deployed Worker on the live site and in the
    // Android app (`--mode android`), otherwise the local one from
    // `wrangler dev`. Both addresses are public; the key is in neither.
    const PROXY_URL = location.origin === "https://rowninator.github.io"
      || import.meta.env.MODE === "android"
      ? "https://pantry-match-ai.rowninator.workers.dev"
      : "http://localhost:8787";
    // Longer than the Worker's 15 s limit, so its own 504 usually arrives first.
    const AI_TIMEOUT_MS = 20000;
    const AI_MESSAGES = {
      none: "No ideas fit your pantry this time. Try again, or add a few more ingredients.",
      garbled: "The AI's answer came back garbled. Try again.",
      timeout: "That took too long. Try again in a moment.",
      rateLimited: "Too many requests. Wait a minute, then try again.",
      quota: "The free AI limit is used up for now. Try again later.",
      busy: "The AI is busy right now. Try again in a minute.",
      offline: "Can't reach the AI right now. Check your connection.",
      failed: "Couldn't get suggestions right now.",
    };

    const form = document.getElementById("add-form");
    const input = document.getElementById("ing-input");
    const pantry = document.getElementById("pantry");
    const chipsEl = document.getElementById("chips");
    const results = document.getElementById("results");
    const aiBtn = document.getElementById("ai-btn");
    const aiResults = document.getElementById("ai-results");
    const savedNote = document.getElementById("saved-note");
    const savedText = document.getElementById("saved-text");

    // The save note turns into the error box when saving doesn't work.
    function showSaveNote(text, ok) {
      savedText.textContent = text;
      savedNote.classList.toggle("is-error", !ok);
    }

    // Some private-browsing modes throw just for reading localStorage; then the page works without saving.
    let storage = null;
    try { storage = window.localStorage; } catch {}
    if (!storage) showSaveNote("Not saved: this browser is blocking storage", false);

    let have = loadPantry(storage);

    // The only place the pantry changes, so every change is saved.
    function setPantry(next) {
      const changed = next.length !== have.length || next.some((name, i) => name !== have[i]);
      have = next;
      if (changed) resetAi();
      if (storage) {
        const saved = savePantry(storage, have);
        showSaveNote(saved ? "Saved on this device" : "Couldn't save on this device", saved);
      }
      render();
    }

    // Most-used ingredients across all recipes, for the "try adding" chips.
    const popular = (() => {
      const counts = new Map();
      for (const r of recipes) for (const i of r.ingredients) counts.set(i, (counts.get(i) || 0) + 1);
      return [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([name]) => name);
    })();

    function el(tag, props = {}, children = []) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    function add(names) {
      const next = [...have];
      for (const name of names) {
        if (!next.some((h) => sameIngredient(h, name))) next.push(name);
      }
      setPantry(next);
    }

    // Re-rendering destroys the focused chip, so a keyboard user's focus moves
    // to the chip now in its place (or the last one). With none left the pantry
    // section is hidden, so focus goes to the Top recipes heading above the
    // empty state (not the input, which would open a phone's keyboard).
    // New chips stay hidden (so unfocusable) until Ionic has set them up.
    async function remove(name) {
      const index = have.indexOf(name);
      const hadFocus = chipsEl.contains(document.activeElement);
      setPantry(have.filter((h) => h !== name));
      if (hadFocus) await refocus(chipsEl, ".chip-x", index);
    }

    // Same for a suggestion chip: focus moves to the suggestion now in its
    // place, or to the Top recipes heading once recipe cards replace them.
    async function addSuggestion(name, index) {
      const hadFocus = results.contains(document.activeElement);
      add([name]);
      if (hadFocus) await refocus(results, ".chip-label", index);
    }

    async function refocus(container, selector, index) {
      const buttons = container.querySelectorAll(selector);
      const next = buttons[Math.min(index, buttons.length - 1)];
      if (!next) return document.getElementById("results-title").focus();
      await next.closest("ion-chip").componentOnReady?.();
      next.focus();
    }

    // Tapping anywhere on a chip works; the inner button gives keyboard and
    // screen-reader users the same action (its click bubbles up). The chip
    // sits in a 48px-tall tap area, Android's minimum, while the pill itself
    // stays 36px (Ionic clips anything outside the pill, hence the wrapper).
    function chipTapArea(onclick, chip) {
      return el("span", { className: "chip-tap", onclick }, [chip]);
    }

    function suggestionChips(count) {
      const picks = popular.filter((p) => !have.some((h) => sameIngredient(h, p))).slice(0, count);
      return el("div", { className: "chips" }, picks.map((p, i) =>
        chipTapArea(() => addSuggestion(p, i), el("ion-chip", { className: "chip suggest" }, [
          el("button", { type: "button", className: "chip-label", textContent: p }),
        ]))
      ));
    }

    function emptyState(title, text, extra = []) {
      const icon = document.getElementById("basket-icon").content.cloneNode(true);
      return el("div", { className: "empty" }, [
        icon,
        el("h3", { textContent: title }),
        el("p", { textContent: text }),
        ...extra,
      ]);
    }

    function recipeCard(recipe) {
      const owned = recipe.ingredients.filter((i) => have.some((h) => sameIngredient(h, i)));
      const missing = recipe.ingredients.filter((i) => !owned.includes(i));
      return el("ion-card", { className: "card" }, [
        el("ion-card-content", {}, [
          el("h3", { className: "card-title", textContent: recipe.name }),
          el("p", { className: "count", textContent: `${owned.length} of ${recipe.ingredients.length} ingredients` }),
          el("p", { className: "have", textContent: owned.join(" · ") }),
          el("p", { className: "missing", textContent: missing.length ? `Missing: ${missing.join(" · ")}` : "Nothing missing" }),
        ]),
      ]);
    }

    // --- AI ideas ---

    // aiRun goes up on every request and every pantry change, so a reply that
    // arrives after the pantry changed is ignored.
    let aiRun = 0;
    let aiController = null;
    let aiBusy = false;

    function setAiBusy(busy) {
      aiBusy = busy;
      aiBtn.replaceChildren(...(busy ? [el("ion-spinner", { name: "dots" }), "Thinking…"] : ["Suggest with AI"]));
      aiBtn.setAttribute("aria-busy", String(busy));
      // Keeps the button's normal colours while busy, so "Thinking…" stays readable.
      aiBtn.classList.toggle("is-busy", busy);
      updateAiBtn();
    }

    function updateAiBtn() {
      aiBtn.disabled = aiBusy || have.length === 0;
    }

    // The AI cards no longer match a changed pantry: drop them and any request.
    function resetAi() {
      aiRun++;
      aiController?.abort();
      aiController = null;
      setAiBusy(false);
      aiResults.replaceChildren();
    }

    function aiMessage(text) {
      return el("p", { className: "ai-msg", textContent: text });
    }

    function aiCard(recipe) {
      return el("ion-card", { className: "card ai-card" }, [
        el("ion-card-content", {}, [
          el("p", { className: "ai-label", textContent: "AI suggestion · check before cooking" }),
          el("h3", { className: "card-title", textContent: recipe.name }),
          el("p", { className: "have", textContent: recipe.ingredients.join(" · ") }),
          el("ol", { className: "steps" }, recipe.steps.map((s) => el("li", { textContent: s }))),
        ]),
      ]);
    }

    // Turns the Worker's response into recipes (an array) or an AI_MESSAGES key.
    async function readAiResponse(response, sent) {
      if (response.status === 200) {
        let body;
        try {
          body = await response.json();
        } catch (error) {
          if (error.name === "AbortError") throw error;
          return "garbled";
        }
        // Second check in case the proxy is ever wrong.
        const ideas = checkSuggestions(body, sent);
        return ideas.length > 0 ? ideas : "none";
      }
      if (response.status === 502) return "garbled";
      if (response.status === 504) return "timeout";
      if (response.status === 429) return "rateLimited";
      if (response.status === 503) {
        const body = await response.json().catch((error) => {
          if (error.name === "AbortError") throw error;
          return null;
        });
        if (body?.error === "quota") return "quota";
        if (body?.error === "busy") return "busy";
      }
      return "failed";
    }

    async function suggestWithAi() {
      if (aiBusy || have.length === 0) return;
      const run = ++aiRun;
      const sent = [...have];
      const controller = new AbortController();
      aiController = controller;
      const timer = setTimeout(() => controller.abort(), AI_TIMEOUT_MS);
      setAiBusy(true);
      aiResults.replaceChildren(el("p", { className: "ai-loading", textContent: "Asking the AI for ideas… this can take up to 20 seconds" }));

      let outcome;
      try {
        const response = await fetch(PROXY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pantry: sent }),
          signal: controller.signal,
        });
        outcome = await readAiResponse(response, sent);
      } catch (error) {
        outcome = error.name === "AbortError" ? "timeout" : "offline";
      } finally {
        clearTimeout(timer);
      }

      if (run !== aiRun) return; // the pantry changed; resetAi already tidied up
      aiController = null;
      setAiBusy(false);
      if (Array.isArray(outcome)) {
        aiResults.replaceChildren(el("div", { className: "cards" }, outcome.map(aiCard)));
        return;
      }
      const lines = [aiMessage(AI_MESSAGES[outcome])];
      // Busy is temporary; point to the built-in matches already shown above.
      if (outcome === "busy" && matchRecipes(have, recipes).length > 0) {
        lines.push(aiMessage("Meanwhile, your best matches from our recipes are in Top recipes above."));
      }
      aiResults.replaceChildren(el("div", { className: "note" }, lines));
    }

    function render() {
      pantry.hidden = have.length === 0;
      updateAiBtn();
      chipsEl.replaceChildren(...have.map((name) =>
        chipTapArea(() => remove(name), el("ion-chip", { className: "chip" }, [
          el("span", { textContent: name }),
          el("button", { type: "button", className: "chip-x", ariaLabel: `Remove ${name}`, textContent: "×" }),
        ]))
      ));

      if (have.length === 0) {
        results.replaceChildren(emptyState("What's in your kitchen?",
          "Add a few ingredients above, or tap one to start.", [suggestionChips(6)]));
        return;
      }

      const matches = matchRecipes(have, recipes);
      if (matches.length === 0) {
        const list = have.length === 1 ? `“${have[0]}”` : "those ingredients";
        results.replaceChildren(emptyState("No recipes yet",
          `None of our ${recipes.length} recipes use ${list}. Try adding something common:`, [suggestionChips(5)]));
        return;
      }

      results.replaceChildren(el("div", { className: "cards" }, matches.map(recipeCard)));
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      add(parseIngredients(input.value ?? ""));
      input.value = "";
      input.setFocus?.();
    });

    document.getElementById("clear-btn").addEventListener("click", () => {
      if (!confirm("Clear your whole pantry?")) return;
      setPantry([]);
      input.setFocus?.();
    });

    aiBtn.addEventListener("click", suggestWithAi);

    render();

    // Android's Back button (ANDROID.md step 6). Only the app build has it, so
    // the website never loads @capacitor/app. Back never reaches us while the
    // keyboard or the Clear all dialog is open: Android closes those itself.
    if (import.meta.env.MODE === "android") {
      const { App } = await import("@capacitor/app");
      const content = document.querySelector("ion-content");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
      App.addListener("backButton", async () => {
        // If Ionic didn't load, there's no scroll element: treat it as the top.
        const scroller = await content.getScrollElement?.();
        const action = backAction({ aiRunning: aiBusy, scrollTop: scroller?.scrollTop ?? 0 });
        if (action === "cancel-ai") resetAi();
        else if (action === "scroll-top") content.scrollToTop(reduceMotion.matches ? 0 : 300);
        else App.minimizeApp();
      });

      // Capacitor picks light or dark status bar icons at launch and keeps them
      // if dark mode changes while the app is open, so ask it to pick again.
      const { SystemBars, SystemBarsStyle } = await import("@capacitor/core");
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        SystemBars.setStyle({ style: SystemBarsStyle.Default });
      });
    }
  </script>
</body>
</html>
